name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test release policy
        run: python -m unittest discover -s .github/tests -v
      - name: Check version policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/lifecycle.py check
      - name: Install and test Python application
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install --editable '.[dev]'
          python -m playwright install chromium
          if [ -d tests ]; then
            python -m pytest tests
          fi
      - name: Notify Telegram on failed checks
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_EVENT: 'Проверки CI'
          NOTIFY_STATUS: ${{ job.status }}
          NOTIFY_DETAILS: ${{ github.ref_name }}
        run: python .github/scripts/notify.py
