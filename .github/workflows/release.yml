name: Publish release or beta
run-name: '${{ inputs.channel || ''beta'' }} — ${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'beta — новая бета; stable — полноценный релиз; cleanup — удалить беты'
        type: choice
        options: [beta, stable, cleanup]
        default: beta
        required: true
      cleanup_betas:
        description: 'Удалить беты этой версии после успешной публикации stable'
        type: boolean
        default: false
      cleanup_version:
        description: 'Версия для cleanup (X.Y.Z); пусто — текущая VERSION'
        type: string
        required: false
  workflow_call:
    inputs:
      channel:
        type: string
        default: beta
      commit:
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: umd-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Use current master
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit || 'master' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test lifecycle and validate version
        if: inputs.channel != 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s .github/tests -v
          python .github/scripts/lifecycle.py check
      - name: Require Python application
        if: inputs.channel != 'cleanup'
        run: |
          if [ ! -f pyproject.toml ]; then
            echo '::error::Сначала добавьте Python-приложение с pyproject.toml. Сборки-заглушки не публикуются.'
            exit 1
          fi
      - name: Promote the latest tested master beta to main
        id: promote
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/lifecycle.py prepare-stable
      - name: Use exact promoted main commit for stable
        if: inputs.channel == 'stable'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.promote.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan version and exact commit
        id: plan
        if: inputs.channel != 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ steps.promote.outputs.sha || inputs.commit }}
          BETA_COMMIT: ${{ steps.promote.outputs.beta_commit }}
          BETA_TAG: ${{ steps.promote.outputs.beta_tag }}
        run: python .github/scripts/lifecycle.py plan --channel "$CHANNEL" --commit "$COMMIT" --beta-commit "$BETA_COMMIT" --beta-tag "$BETA_TAG"
      - name: Test and build Windows x64 portable desktop application
        if: inputs.channel != 'cleanup'
        env:
          UMD_BUILD_VERSION: ${{ steps.plan.outputs.package_version }}
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.plan.outputs.package_version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          python -m pip install --editable '.[dev,build]'
          python scripts/provision_tools.py
          python -m playwright install chromium
          python scripts/build_windows.py --version "$UMD_BUILD_VERSION" --tag "$RELEASE_TAG"
          python .github/scripts/lifecycle.py verify --version "$UMD_BUILD_VERSION" --tag "$RELEASE_TAG"
      - name: Keep verified build artifacts
        if: inputs.channel != 'cleanup'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umd-${{ steps.plan.outputs.tag }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish GitHub Release with artifacts
        id: publish
        if: inputs.channel != 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/lifecycle.py publish
      - name: Remove betas after successful stable publication
        if: inputs.channel == 'stable' && inputs.cleanup_betas == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: python .github/scripts/lifecycle.py cleanup --version "$VERSION"
      - name: Remove betas of an already published stable version
        if: inputs.channel == 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_VERSION: ${{ inputs.cleanup_version }}
        run: python .github/scripts/lifecycle.py cleanup --version "$CLEANUP_VERSION"
      - name: Record publication
        if: success() && inputs.channel != 'cleanup'
        env:
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: echo "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_EVENT: 'Публикация / очистка: ${{ inputs.channel }}'
          NOTIFY_STATUS: ${{ job.status }}
          NOTIFY_DETAILS: ${{ steps.plan.outputs.tag || inputs.cleanup_version }}
          NOTIFY_URL: ${{ steps.publish.outputs.url }}
          NOTIFY_NOTES_FILE: ${{ steps.publish.outputs.url != '' && format('release-notes/{0}.md', steps.plan.outputs.version) || '' }}
          NOTIFY_DOWNLOAD_URL: ${{ steps.publish.outputs.url != '' && format('https://github.com/{0}/releases/download/{1}/UMD-{1}-windows-x64.zip', github.repository, steps.plan.outputs.tag) || '' }}
        run: python .github/scripts/notify.py
