[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm==9.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "umd-desktop"
dynamic = ["version"]
description = "Universal Media Downloader: durable media metadata processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright==1.63.0", "PySide6==6.11.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8", "pytest==9.1.1"]

[project.scripts]
umd-console = "app.ui.cli:main"

[project.gui-scripts]
umd = "app.ui.gui:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools_scm]
version_file = "app/_version.py"
fallback_version = "0.1.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
